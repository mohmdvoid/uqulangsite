<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{site_url}}{{path}}">
{{feed_link}}
{{alternates}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a100e" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="uqulang">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{site_url}}{{path}}">
<meta property="og:image" content="{{site_url}}{{base}}/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="uqulang — a compiled systems language">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{base}}/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="{{base}}/assets/img/apple-touch-icon.png">
<link rel="manifest" href="{{base}}/manifest.webmanifest">

<link rel="stylesheet" href="{{stylesheet}}">

<script>{{theme_init}}</script>
<script type="module" src="{{base}}/assets/js/main.js"></script>
{{modulepreload}}
{{head_extra}}
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">{{skip_label}}</a>

<header class="site-header" data-nav-drawer>
  <div class="container site-header__inner">
    <a class="brand" href="{{home_href}}" aria-label="uqulang — {{home_label}}">
      <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
        <path d="M19.8 8.4A9 9 0 1 0 19.8 23.6" stroke="var(--clr-brand)" stroke-width="3.1" stroke-linecap="round"/>
        <path d="M22.4 11.7 27 16l-4.6 4.3" stroke="var(--clr-brand)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__text">uqulang</span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-label="{{menu_label}}">
      <svg class="nav-toggle__open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="nav-toggle__close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <nav class="site-nav" id="site-nav" data-nav-panel aria-label="{{nav_label}}">
      {{nav_links}}
    </nav>

    <div class="site-header__actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="{{theme_label}}">
        <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      {{lang_switch}}
      {{header_cta}}
    </div>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="site-footer">
  <div class="container">
    <div class="site-footer__grid">
      <div class="site-footer__about">
        <a class="brand" href="{{home_href}}">
          <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
            <path d="M19.8 8.4A9 9 0 1 0 19.8 23.6" stroke="var(--clr-brand)" stroke-width="3.1" stroke-linecap="round"/>
            <path d="M22.4 11.7 27 16l-4.6 4.3" stroke="var(--clr-brand)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand__text">uqulang</span>
        </a>
        {{footer_about}}
      </div>
      {{footer_groups}}
    </div>

    <div class="site-footer__bottom">
      <p>{{footer_legal}}</p>
      <p class="site-footer__made">{{footer_made}}</p>
    </div>
  </div>
</footer>
</body>
</html>
