# nginx for uqulang.com — self-hosted or behind a CDN.
#
# The site is static files. Everything below is about serving them correctly:
# clean URLs, the right cache lifetime per asset class, precompressed bodies,
# and the security headers that _headers carries on the managed hosts.

server {
    listen 80;
    listen [::]:80;
    server_name uqulang.com www.uqulang.com;
    return 301 https://uqulang.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.uqulang.com;

    ssl_certificate     /etc/letsencrypt/live/uqulang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uqulang.com/privkey.pem;

    return 301 https://uqulang.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uqulang.com;

    root /srv/uqulang.com;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/uqulang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uqulang.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Serve the .br and .gz files the build produced rather than compressing
    # every response again. gzip_static is built in; brotli_static needs the
    # ngx_brotli module.
    gzip_static on;
    # brotli_static on;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/atom+xml image/svg+xml application/manifest+json;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zaVgd9JCZD3M6NqkVC2VdrigvqC/i/lvz5N03DdhgsQ='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options           "DENY" always;

    # Clean URLs: /docs/tour/ -> /docs/tour/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Content-hashed filename: safe to keep for a year.
    location /assets/css/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Not fingerprinted — import specifiers are literal paths.
    location /assets/js/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location /assets/img/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /feed.xml   { add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

    # Redirects that _redirects handles on managed hosts
    location /community/ { return 301 https://uqulang.com/universities/; }
    location /arabic/    { return 301 https://uqulang.com/ar/; }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html { internal; }
    location = /500.html { internal; }

    access_log /var/log/nginx/uqulang.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/uqulang.error.log warn;
}
