# Netlify. Headers and redirects come from _headers and _redirects so that
# moving host does not mean rewriting them.

[build]
  command = "pip install -r requirements.txt && python3 tools/build.py --check && python3 tools/check_links.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
    performance = 0.95
    accessibility = 1.0
    best-practices = 1.0
    seo = 1.0
