name: site

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt brotli

      # The generated HTML is committed. If it does not match the sources,
      # somebody edited output by hand or forgot to run the build.
      - name: Test suite
        run: python3 -m unittest discover -s tests -t . -v

      - name: Generated output is up to date
        run: python3 tools/build.py --check

      - name: Links, headings, metadata, canonical domain
        run: python3 tools/check_links.py

      - name: Build the deployment directory and enforce the budget
        run: python3 tools/postprocess.py

      - name: Quality dashboard
        run: python3 tools/report.py

      - name: Upload deployment directory
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

      - name: Upload quality dashboard
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/
          retention-days: 30

      - name: Summarise on the run page
        if: always()
        run: |
          python3 tools/report.py --json > report.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("report.json"))
          t, b = d["tests"], d["budget"]
          print("## Build report\n")
          print(f"- **{t['run']} tests**, {t['failures']} failing, {t['seconds']}s")
          print(f"- **{len(d['pages'])} pages** across {len(d['locales'])} locales")
          print(f"- Heaviest page plus assets: **{b['page_total_gzip']/1024:.1f} KB** gzipped "
                f"({b['headroom']}% under budget)")
          print("\n| Locale | Pages | Coverage |\n| --- | --- | --- |")
          for code, loc in d["locales"].items():
              print(f"| {code} | {loc['pages']} | {loc['coverage']}% |")
          PY

  accessibility:
    name: Accessibility and performance
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Serve the deployment directory
        run: npx --yes serve -s dist -l 8080 &

      - name: Wait for the server
        run: npx --yes wait-on http://localhost:8080 --timeout 30000

      # Fails the build on a regression rather than reporting one.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/docs/tour/
            http://localhost:8080/install/
            http://localhost:8080/ar/
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify, accessibility]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://uqulang.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Replace this step with whichever host you settle on. The artifact above
      # is the whole site, already minified and precompressed.
      - name: Publish
        run: |
          echo "dist/ is ready: $(find dist -type f | wc -l) files"
          echo "Configure a host here — see deploy/README.md"
